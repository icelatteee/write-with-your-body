<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OUTPUT // GESTURE → HYDRA</title>
    <script src="https://unpkg.com/hydra-synth"></script>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
      #hydra-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
      #hydra-code-output {
        position: fixed; left: 24px; bottom: 20px; margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; line-height: 1.5;
        color: #fff; background: rgba(0, 0, 0, 0.6); padding: 10px 14px; white-space: pre;
      }
      #hydra-code-output.hidden { display: none; }
      #hint {
        position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
        font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #aaa;
        background: rgba(0,0,0,0.6); padding: 6px 10px; transition: opacity 0.6s;
      }
    </style>
  </head>
  <body>
    <!-- Projector window. Drag it onto the second screen, then click or press F for full screen.
         It shows whatever is RUN on the laptop window (index.html). H = hide/show the code. -->
    <canvas id="hydra-canvas"></canvas>
    <pre id="hydra-code-output">// waiting for RUN on the laptop</pre>
    <div id="hint">CLICK OR PRESS F FOR FULL SCREEN · H HIDES THE CODE</div>

    <script>
      const cv = document.getElementById("hydra-canvas");
      cv.width = window.innerWidth;
      cv.height = window.innerHeight;
    </script>
    <script src="symbols.js"></script>
    <script src="hydra_interpreter.js"></script>
    <script>
      solid(0, 0, 0).out();

      function fit() { hydra.setResolution(window.innerWidth, window.innerHeight); }
      window.addEventListener("resize", fit);

      const channel = new BroadcastChannel("gesture-hydra");
      channel.onmessage = (e) => {
        if (e.data && e.data.type === "run") runHydraPipeline(e.data.strip);
      };
      channel.postMessage({ type: "hello" }); // ask the laptop window for the current program

      function goFull() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        document.getElementById("hint").style.opacity = 0;
      }
      document.addEventListener("click", goFull);
      window.addEventListener("keydown", (e) => {
        if (e.code === "KeyF") goFull();
        if (e.code === "KeyH") document.getElementById("hydra-code-output").classList.toggle("hidden");
      });
    </script>
  </body>
</html>
